name: AICTE Auto Bot

on:
  schedule:
    # Backup trigger: Agar kabhi kuch ruke toh har 5 min mein check karega
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Ek time par ek hi shift chalegi taaki 2 bot aapas mein na takrayein
concurrency:
  group: aicte-infinite-bot
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run AICTE Bot (5.5 Hours Non-Stop Shift)
        env:
          AICTE_COOKIES: ${{ secrets.AICTE_COOKIES }}
          AICTE_TOKEN: ${{ secrets.AICTE_TOKEN }}
          AICTE_EMAIL: ${{ secrets.AICTE_EMAIL }}
          AICTE_PASSWORD: ${{ secrets.AICTE_PASSWORD }}
        run: python bot.py

      - name: Instant Auto-Restart Next Shift
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pehli shift khatam! Turant agli non-stop shift chalu kar raha hu..."
          gh workflow run "AICTE Auto Bot" || true
